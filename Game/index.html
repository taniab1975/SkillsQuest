<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play SkillQuest</title>
  <style>
    body { margin: 0; overflow: hidden; background: #101923; }
    iframe { display: block; width: 100%; height: 100dvh; border: 0; }
  </style>
</head>
<body>
  <iframe id="game" title="Playable SkillQuest game" src="/skillquest/?view=embed"></iframe>
  <script>
    const game = document.getElementById('game');
    game.addEventListener('load', () => {
      if (document.activeElement === document.body) game.contentWindow.focus();
    });
  </script>
</body>
</html>
